<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=800">
  <title>Envíos Dosruedas - Home Hero Variant 3: Mar del Plata Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Geist+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* === DESIGN TOKENS === */
    :root {
      --brand-blue: #0636A5;
      --brand-blue-50: #E6EEFE;
      --brand-blue-100: #BACEFD;
      --brand-blue-200: #8EAFFB;
      --brand-blue-600: #0742CA;
      --brand-blue-700: #0636A5;
      --brand-blue-800: #052D8C;
      --brand-blue-900: #04236B;
      --brand-blue-950: #021440;
      --brand-yellow: #FFEC01;
      --brand-yellow-50: #FFFDE6;
      --brand-yellow-100: #FFFAB8;
      --brand-yellow-200: #FFF78A;
      --brand-yellow-600: #E6D400;
      --white: #FFFFFF;
      --success: #16A34A;
      --success-light: #DCFCE7;

      --font-display: 'Anton', sans-serif;
      --font-subheading: 'Bebas Neue', sans-serif;
      --font-sans: 'IBM Plex Sans', sans-serif;
      --font-mono: 'Geist Mono', monospace;

      --shadow-float: 0 25px 50px -12px rgba(6, 54, 165, 0.15);
      --shadow-elevated: 0 20px 40px -8px rgba(6, 54, 165, 0.2), 0 8px 16px -4px rgba(6, 54, 165, 0.12);
      --shadow-hover-lift: 0 32px 64px -12px rgba(6, 54, 165, 0.25);
      --shadow-antigravity: 0 30px 60px -15px rgba(6, 54, 165, 0.3), 0 0 50px -10px rgba(255, 236, 1, 0.15);
      --shadow-cta-glow: 0 0 40px rgba(255, 236, 1, 0.4), 0 0 80px rgba(255, 236, 1, 0.15);
      --shadow-inner: inset 0 2px 4px rgba(6, 54, 165, 0.06);
      --shadow-accent-sm: 0 2px 4px rgba(255, 236, 1, 0.15);
      --shadow-accent-md: 0 4px 8px rgba(255, 236, 1, 0.2), 0 2px 4px rgba(255, 236, 1, 0.1);

      --radius-bezel-outer: 16px;
      --radius-bezel-inner: 12px;
      --radius-full: 9999px;
      --radius-xl: 12px;

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --space-12: 48px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* === RESET === */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1920px; height: 800px; overflow: hidden; }

    /* === BANNER CONTAINER === */
    .banner {
      position: relative;
      width: 1920px;
      height: 800px;
      background:
        linear-gradient(135deg, var(--brand-blue-950) 0%, var(--brand-blue-800) 50%, var(--brand-blue-700) 100%),
        url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxOTIwIiBoZWlnaHQ9IjgwMCI+PGZpbHRlciBpZD0ibm9pc2UiPjxmZVR1cmJ1bGVuY2UgYmFzZUZyZXF1ZW5jeT0iMC45IiBudW1PY3RhdmVzPSI0IiBzdGl0Y2hUaWxlcz0ic3RpdGNoIi8+PC9maWx0ZXI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsdGVyPSJ1cmwoI25vaXNlKSIgb3BhY2l0eT0iMC4wMyIvPjwvc3ZnPg==');
      font-family: var(--font-sans);
      color: var(--white);
      display: flex;
      flex-direction: column;
    }

    /* Map texture overlay */
    .map-texture {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 30% 40%, rgba(255,236,1,0.04) 0%, transparent 40%),
        radial-gradient(ellipse at 70% 60%, rgba(6,54,165,0.08) 0%, transparent 50%),
        repeating-linear-gradient(45deg, transparent, transparent 19px, rgba(6,54,165,0.015) 19px, rgba(6,54,165,0.015) 20px);
      pointer-events: none;
      z-index: 0;
    }

    .overlay-gradient {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(6,54,165,0.6) 0%, rgba(6,54,165,0.2) 50%, rgba(6,54,165,0.7) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .banner > * { position: relative; z-index: 2; }

    /* === LAYOUT === */
    .banner-content {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: var(--space-8) var(--space-10);
    }

    /* Top Bar - Logo */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--space-4) 0;
    }

    .logo-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .logo-main {
      font-family: var(--font-display);
      font-size: clamp(1.75rem, 2.5vw, 2.5rem);
      letter-spacing: -0.01em;
      line-height: 1.1;
    }

    .logo-main strong { color: var(--brand-yellow); }

    .logo-tagline {
      font-family: var(--font-sans);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--brand-blue-100);
      font-weight: 600;
    }

    /* Center Content */
    .center-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .display-headline {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 4.5vw, 4rem);
      line-height: 1.02;
      letter-spacing: -0.02em;
      text-wrap: balance;
      margin-bottom: var(--space-6);
      text-shadow: 0 4px 24px rgba(0,0,0,0.2);
    }

    .display-headline .highlight { color: var(--brand-yellow); }

    .zone-cards {
      display: flex;
      gap: var(--space-4);
      margin-top: var(--space-8);
      flex-wrap: wrap;
      justify-content: center;
    }

    /* Zone Card */
    .zone-card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: var(--radius-xl);
      padding: var(--space-5) var(--space-8);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      min-width: 140px;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: pointer;
    }

    .zone-card:hover {
      background: rgba(255,255,255,0.15);
      border-color: var(--brand-yellow);
      box-shadow: var(--shadow-antigravity);
      transform: translateY(-4px);
    }

    .zone-card.active {
      background: var(--brand-yellow);
      border-color: var(--brand-yellow);
      color: var(--brand-blue-700);
    }

    .zone-card.active .zone-name { color: var(--brand-blue-900); }
    .zone-card.active .zone-eta { color: var(--brand-blue-700); }
    .zone-card.active .zone-pulse { background: var(--brand-blue-700); }

    .zone-name {
      font-family: var(--font-display);
      font-size: 18px;
      letter-spacing: 0.01em;
      color: var(--white);
      transition: color 0.3s ease;
    }

    .zone-eta {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--brand-yellow);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .zone-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--brand-yellow);
      animation: pulseDot 2s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* Bottom CTA */
    .bottom-cta {
      padding: var(--space-6) 0 var(--space-4);
    }

    .nested-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-4);
      height: 56px;
      padding: 0 var(--space-8);
      border-radius: var(--radius-full);
      font-family: var(--font-subheading);
      font-size: 16px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 700;
      text-decoration: none;
      border: 2px solid;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
      overflow: hidden;
    }

    .nested-pill.primary {
      background: var(--brand-yellow);
      color: var(--brand-blue-700);
      border-color: var(--brand-yellow);
      box-shadow: var(--shadow-accent-md);
    }

    .nested-pill.primary:hover {
      background: var(--brand-yellow-200);
      box-shadow: var(--shadow-cta-glow);
      transform: scale(1.02) translateY(-2px);
    }

    .nested-pill .pill-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      background: rgba(6, 54, 165, 0.1);
      color: var(--brand-blue-700);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .nested-pill.primary:hover .pill-icon {
      background: var(--brand-blue-700);
      color: var(--white);
      transform: translateX(4px);
    }

    .pill-icon svg { width: 20px; height: 20px; }

    /* Staggered entrance animations */
    .top-bar { opacity: 0; transform: translateY(-20px); animation: revealDown 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
    .center-content > * { opacity: 0; transform: translateY(30px); animation: revealUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
    .display-headline { animation-delay: 0.1s; }
    .zone-cards { animation-delay: 0.3s; }
    .bottom-cta { animation-delay: 0.5s; }

    @keyframes revealDown { to { opacity: 1; transform: translateY(0); } }
    @keyframes revealUp { to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="banner">
    <!-- Map texture layer -->
    <div class="map-texture" aria-hidden="true"></div>
    <div class="overlay-gradient" aria-hidden="true"></div>

    <div class="banner-content">
      <!-- Top Bar -->
      <header class="top-bar" role="banner">
        <div class="logo-group">
          <span class="logo-main">Envíos <strong>Dosruedas</strong></span>
          <span class="logo-tagline">tu solución confiable</span>
        </div>
        <div class="cert-badge" style="display:flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15);border-radius:9999px;font-size:11px;font-family:var(--font-subheading);letter-spacing:0.08em;text-transform:uppercase;color:var(--brand-yellow);">
          <span style="display:flex;align-items:center;gap:4px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            3PL Certificado
          </span>
        </div>
      </header>

      <!-- Center Content -->
      <main class="center-content">
        <h1 class="display-headline">
          CONECTAMOS MAR DEL PLATA<br>
          DE <span class="highlight">PUNTA A PUNTA</span>
        </h1>

        <div class="zone-cards" role="group" aria-label="Zonas de cobertura con tiempos estimados">
          <button class="zone-card" data-zone="centro" aria-label="Centro - 8 minutos">
            <span class="zone-name">Centro</span>
            <span class="zone-eta"><span class="zone-pulse" aria-hidden="true"></span>8 min</span>
          </button>
          <button class="zone-card active" data-zone="guemes" aria-label="Güemes - 12 minutos - zona activa">
            <span class="zone-name">Güemes</span>
            <span class="zone-eta"><span class="zone-pulse" aria-hidden="true"></span>12 min</span>
          </button>
          <button class="zone-card" data-zone="playa-grande" aria-label="Playa Grande - 15 minutos">
            <span class="zone-name">Playa Grande</span>
            <span class="zone-eta"><span class="zone-pulse" aria-hidden="true"></span>15 min</span>
          </button>
          <button class="zone-card" data-zone="puerto" aria-label="Puerto - 18 minutos">
            <span class="zone-name">Puerto</span>
            <span class="zone-eta"><span class="zone-pulse" aria-hidden="true"></span>18 min</span>
          </button>
          <button class="zone-card" data-zone="batan" aria-label="Batán / Parque Industrial - 25 minutos">
            <span class="zone-name">Batán / P. Industrial</span>
            <span class="zone-eta"><span class="zone-pulse" aria-hidden="true"></span>25 min</span>
          </button>
        </div>
      </main>

      <!-- Bottom CTA -->
      <footer class="bottom-cta">
        <a href="/cotizar/express" class="nested-pill primary" aria-label="Cotizar mi envío ahora">
          <span>Cotizar mi envío</span>
          <span class="pill-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </span>
        </a>
      </footer>
    </div>
  </div>
</body>
</html>
