<!-- @startingPoint section="Website" subtitle="Envios Dosruedas marketing site — 4 screens, click-through" viewport="1440x900" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Envios Dosruedas — Sitio</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--surface-page)}a{color:inherit}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="ServicioScreen.jsx"></script>
<script type="text/babel" src="CotizarScreen.jsx"></script>
<script type="text/babel" src="ContactoScreen.jsx"></script>
<script type="text/babel">
function App(){
  const [screen,setScreen]=React.useState("home");
  const go=s=>{setScreen(s);window.scrollTo(0,0);};
  return (<div>
    <Navbar screen={screen} go={go}/>
    {screen==="home"&&<HomeScreen go={go}/>}
    {screen==="servicio"&&<ServicioScreen go={go}/>}
    {screen==="cotizar"&&<CotizarScreen/>}
    {screen==="contacto"&&<ContactoScreen/>}
    <Footer/>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
