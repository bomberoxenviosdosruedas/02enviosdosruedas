<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page)}.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}</style></head>
<body><div style="position:relative;overflow:hidden;border-radius:var(--radius-3xl);background:var(--brand-blue);padding:24px;height:140px">
<div style="position:absolute;top:-70px;left:-40px;width:220px;height:220px;border-radius:50%;background:rgba(255,236,1,.18);filter:blur(80px)"></div>
<div style="position:relative;display:flex;gap:16px;align-items:center">
<div style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(12px);border-radius:var(--radius-2xl);padding:16px 20px;color:#fff;font-family:var(--font-subheading);letter-spacing:.08em;text-transform:uppercase">Cálculo automático</div>
<span style="display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.15);color:#fff;font-family:var(--font-body);font-size:12px"><span style="width:8px;height:8px;border-radius:50%;background:var(--brand-yellow);box-shadow:var(--glow-yellow)"></span>Servicio Disponible</span>
</div></div></body></html>
