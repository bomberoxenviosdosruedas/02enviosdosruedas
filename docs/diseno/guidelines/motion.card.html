<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page)}.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}</style></head>
<body><div class="row" style="font-family:var(--font-body);font-size:12px;color:var(--text-muted);gap:24px">
<div style="display:grid;gap:6px"><div style="width:150px;height:44px;border-radius:var(--radius-md);background:var(--action-primary)"></div>rest</div>
<div style="display:grid;gap:6px"><div style="width:150px;height:44px;border-radius:var(--radius-md);background:var(--action-primary);filter:brightness(.92);transform:scale(1.03);box-shadow:var(--shadow-xl)"></div>hover (brightness .92, lift)</div>
<div style="display:grid;gap:6px"><div style="width:150px;height:44px;border-radius:var(--radius-md);background:var(--action-primary);transform:scale(.98)"></div>press (scale .98)</div></div></body></html>
