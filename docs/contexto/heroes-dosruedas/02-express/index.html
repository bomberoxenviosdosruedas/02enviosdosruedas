<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Express · Cronómetro · Envíos DosRuedas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Geist+Mono:wght@400;500;700&family=Outfit:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage wrap">
  <div class="frame">
    <div class="s-accent">
      <div class="hero h-exp">
        <div class="txt">
          <span class="eyebrow">Mensajería en moto</span>
          <h1 class="h-lg">Envíos Express, <span class="knock">puerta a puerta</span></h1>
          <p class="lead">Retiramos tu paquete y lo entregamos en 60 a 90 minutos en todo Mar del Plata. Tarifa fija por distancia y coordinación directa por WhatsApp.</p>
          <div class="route" aria-label="Recorrido directo"><span class="pin">A</span>Retiro<span class="line"></span>Entrega<span class="pin y">B</span></div>
          <dl class="facts">
            <div><dt>Tarifa desde</dt><dd>$3.700</dd></div>
            <div><dt>Por bulto</dt><dd>15 kg</dd></div>
            <div><dt>Cobertura</dt><dd>MDQ</dd></div>
          </dl>
          <div class="ctas">
            <a class="pill" href="#express">Cotizá tu envío <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
            <a class="pill out" href="#express">WhatsApp <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
          </div>
        </div>
        <div class="clock">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <circle cx="100" cy="100" r="100" fill="#FFFFFF"/>
            <circle cx="100" cy="100" r="86" fill="#F3F7FF" stroke="#E6EEFE" stroke-width="14"/>
            <g stroke="#BACEFD" stroke-width="2">
              <line x1="100" y1="6" x2="100" y2="16"/><line x1="194" y1="100" x2="184" y2="100"/><line x1="100" y1="194" x2="100" y2="184"/><line x1="6" y1="100" x2="16" y2="100"/>
            </g>
            <circle class="arc" style="--len:354" cx="100" cy="100" r="86" fill="none" stroke="#0950F6" stroke-width="14" stroke-linecap="round" transform="rotate(-90 100 100)"/>
            <circle class="arc" style="--len:170" cx="100" cy="100" r="86" fill="none" stroke="#FFEC01" stroke-width="14" stroke-linecap="round" transform="rotate(152 100 100)"/>
          </svg>
          <div class="center"><span class="num">60–90</span><span class="unit">minutos</span></div>
          <img src="../assets/express-moto.webp" alt="Moto de reparto de Envíos DosRuedas con caja amarilla" width="560" height="373">
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
