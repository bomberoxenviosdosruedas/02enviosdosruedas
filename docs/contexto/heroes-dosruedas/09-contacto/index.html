<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contacto · Conmutador · Envíos DosRuedas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Geist+Mono:wght@400;500;700&family=Outfit:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage wrap">
  <div class="frame">
    <div class="s-blue glow">
      <div class="hero h-con">
        <div class="txt">
          <span class="eyebrow">Conexión directa</span>
          <h1 class="h-lg">Hablemos de <span class="knock">tus envíos</span></h1>
          <p class="lead">Sin formularios largos ni esperas. Elegí el canal que te quede más cómodo.</p>
          <ul class="chan">
            <li><span class="gl"><svg width="22" height="22" viewBox="0 0 24 24" fill="#25D366" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20Z"/></svg></span><div><b>WhatsApp comercial</b><span id="tel">223 660-2699</span></div><button type="button" class="copy" id="copy-tel">Copiar</button></li>
            <li><span class="gl"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0950F6" stroke-width="2" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg></span><div><b>Hub central</b><span>Friuli 1972, Mar del Plata</span></div><span class="live">Lun a sáb</span></li>
          </ul>
        </div>
        <div class="con-art">
        <img src="../assets/contacto-mensaje.webp" alt="Teléfono y sobre con el mensaje Escribinos hoy" width="400" height="400">
        <div class="form-card">
          <form class="in" id="cform" novalidate>
            <h3>Pedí tu cotización</h3>
            <div class="fld"><label for="c-nombre">Tu nombre</label><input id="c-nombre" name="nombre" placeholder="Ej: Ana García" autocomplete="name"><span class="err" id="c-err" hidden>Escribí tu nombre para saber cómo dirigirnos a vos.</span></div>
            <div class="fld"><label for="c-negocio">Negocio</label><input id="c-negocio" name="negocio" placeholder="Ej: Tienda Mar Azul" autocomplete="organization"></div>
            <div class="fld"><label for="c-vol">Envíos por mes</label><select id="c-vol" name="vol"><option>1 a 50 envíos</option><option>51 a 200 envíos</option><option>Más de 200 envíos</option></select></div>
            <button class="pill" type="submit">Hablar por WhatsApp <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
            <p class="ok-msg" id="c-ok" hidden></p>
          </form>
        </div>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
